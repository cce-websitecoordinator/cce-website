version: "3.9"

services:
  db:
    image: postgres:14-alpine
    platform: linux/arm64
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    restart: always

  app:
    build:
      context: .
    platform: linux/arm64
    entrypoint: /app/entrypoint.prod.sh
    restart: always
    # CHANGE 1: We use 'ports' instead of 'expose' to lock it to localhost:8000
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - DEBUG=0
      - DATABASE_USER=${DB_USERNAME}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - PRODUCTION=True
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - db

  # CHANGE 2: The 'proxy' and 'certbot' services are REMOVED.
  # Your Host Nginx is now acting as the proxy.
  # If we leave them here, they will crash your server by fighting for Port 80.

volumes:
  postgres_data:
  certbot-web:
  proxy-dhparams:
  certbot-certs: